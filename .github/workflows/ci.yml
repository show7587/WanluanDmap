# PR 的基本檢查：資料檔驗證 + lint + 建置。
# 正式部署（deploy.yml）在 build 前也會再驗一次資料檔。
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate road hazard data
        working-directory: frontend
        run: npm run validate:data

      - name: Lint
        working-directory: frontend
        run: npx eslint .

      - name: Build
        working-directory: frontend
        run: npm run build
